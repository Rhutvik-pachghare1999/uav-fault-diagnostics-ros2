[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "isaac_dataset",
    "ros2_ws/build",
    "ros2_ws/install",
    "ros2_ws/src/uav_aegis/uav_aegis/vendor",
]

# Lint gate mirrors .flake8 (and CI's flake8 invocation). select is
# pinned so developer machines cannot widen it with local tool config.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Isaac Sim needs SimulationApp before omni/pxr imports, and scripts/
# bootstraps sys.path before sibling imports.
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
